[project]
name = "pachislot-ai"
version = "0.1.0"
description = "パチスロ情報に特化したAIアプリ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "huggingface-hub>=0.29.0",
    "llama-cpp-python>=0.3.8",
    "sqlalchemy>=2.0.0",
    "openpyxl>=3.1.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "llm: tests that require a loaded LLM model",
    "embedding: tests that require loading the embedding model (CPU, slower)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
